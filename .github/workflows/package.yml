name: Package Relay

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-26
            arch: arm64
          - platform: macOS
            runner: macos-26-intel
            arch: amd64
          - platform: windows
            runner: windows-2025
            arch: amd64
          - platform: windows
            runner: windows-11-arm
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          check-latest: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GOFLAGS: -mod=readonly
        run: |
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          command -v pkg-config || brew install pkgconf
          ./scripts/build-macos-deps.sh
          ./scripts/package-macos.sh
          unzip -tq "build/Relay-macOS-$TARGET_ARCH.zip"
          codesign --verify --deep --strict build/Relay.app
          if [[ "$TARGET_ARCH" = arm64 ]]; then expected=arm64; else expected=x86_64; fi
          test "$(lipo -archs build/Relay.app/Contents/MacOS/Relay)" = "$expected"
          for library in build/Relay.app/Contents/Frameworks/*.dylib; do
            test "$(lipo -archs "$library")" = "$expected"
          done

      - name: Build and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/package-windows.ps1 -Architecture $env:TARGET_ARCH

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Relay-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/Relay-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish tagged packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Relay-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Relay-*.zip > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber Relay-*.zip SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes Relay-*.zip SHA256SUMS.txt
          fi
