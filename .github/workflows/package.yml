name: Package Relaydroid

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'release'
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-26
            arch: arm64
          - platform: macOS
            runner: macos-26-intel
            arch: amd64
          - platform: windows
            runner: windows-2025
            arch: amd64
          - platform: windows
            runner: windows-11-arm
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          check-latest: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GOFLAGS: -mod=readonly
        run: |
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          command -v pkg-config || brew install pkgconf
          ./scripts/build-macos-deps.sh
          ./scripts/package-macos.sh
          unzip -tq "build/Relaydroid-macOS-$TARGET_ARCH.zip"
          codesign --verify --deep --strict build/Relaydroid.app
          if [[ "$TARGET_ARCH" = arm64 ]]; then expected=arm64; else expected=x86_64; fi
          test "$(lipo -archs build/Relaydroid.app/Contents/MacOS/Relaydroid)" = "$expected"
          for library in build/Relaydroid.app/Contents/Frameworks/*.dylib; do
            test "$(lipo -archs "$library")" = "$expected"
          done

      - name: Build and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/package-windows.ps1 -Architecture $env:TARGET_ARCH

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Relaydroid-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/Relaydroid-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload corresponding macOS library sources
        if: matrix.platform == 'macOS' && matrix.arch == 'arm64' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Relaydroid-native-sources
          path: build/native/sources/*
          if-no-files-found: error

  package_gate:
    name: Package checks
    if: always() && github.event_name != 'release'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Require all package builds to succeed
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$PACKAGE_RESULT" = success

  prepare_release:
    name: Prepare release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Relaydroid-*
          path: release-assets
          merge-multiple: true
      - name: Create release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$DEFAULT_BRANCH" --jq .status)"
          case "$relation" in
            identical|ahead) ;;
            *) echo "::error::Release tags must point to a commit on $DEFAULT_BRANCH."; exit 1 ;;
          esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          cd release-assets
          sha256sum Relaydroid-*.zip libmtp-*.tar.gz libusb-*.tar.bz2 > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            Relaydroid-*.zip libmtp-*.tar.gz libusb-*.tar.bz2 SHA256SUMS.txt

  verify_release:
    name: Verify published macOS packages
    if: github.event_name == 'release' && !github.event.release.prerelease && github.event.release.tag_name != 'v0.3.0'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify signed and notarized packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/verify-release-macos.sh "$RELEASE_TAG" "$RUNNER_TEMP/relaydroid-sha256.txt"
